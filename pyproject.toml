[project]
name = "rag-proto"
version = "0.1.0"
description = "Прототип гетерогенной корпоративной RAG-системы"
authors = [{ name = "Ivan Demin", email = "horhe227752@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]
