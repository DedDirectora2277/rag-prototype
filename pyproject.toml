[project]
name = "rag-proto"
version = "0.1.0"
description = "Прототип гетерогенной корпоративной RAG-системы"
authors = [{ name = "Ivan Demin", email = "horhe227752@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.157.0,<0.158.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    # ragas -> instructor 1.17 тянет jiter<0.16, а openai>=3.4 требует jiter>=0.16
    "openai (>=3.3.0,<3.4.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pgvector (>=0.5.1,<0.6.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    # 0.26.0 портит координаты узлов на части файлов (row == start_byte), после чего
    # node.text падает с segfault; регрессия — tests/chunkers/test_code_ast.py
    "tree-sitter (>=0.25.2,<0.26.0)",
    "tree-sitter-language-pack (>=1.22.1,<2.0.0)",
    "tiktoken (>=0.14.0,<0.15.0)",
    "pdfplumber (>=0.11.10,<0.12.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "asyncpg-stubs (>=0.32.0,<0.33.0)",
    "pandas-stubs (>=3.0.5.260914,<4.0.0.0)",
    "types-openpyxl (>=3.1.5.20261017,<4.0.0.0)",
]
bench = [
    "ragas (>=0.4.3,<0.5.0)",
    "datasets (>=5.1.0,<6.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "matplotlib (>=3.10,<4)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: тесты с живым PostgreSQL из docker compose",
]
