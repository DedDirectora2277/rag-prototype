# FastGPT v4.17 для бенчмарка rag-proto: урезанный deploy/docker/.../docker-compose.pg.yml
# (оригинал — в репозитории FastGPT, тег v4.17.2). Оставлено ядро базы знаний: app, mongo,
# pgvector, redis, minio, plugin, code-sandbox. Убраны агентские песочницы (opensandbox,
# volume-manager, agent-sandbox-proxy); модели ходят напрямую в LiteLLM стенда
# через «custom request URL» (aiproxy
# оставлен только потому, что 4.17 без него не стартует). Добавлены лимиты памяти (WSL падал от OOM).

x-share-db-config: &x-share-db-config
  MONGODB_URI: mongodb://myusername:mypassword@fastgpt-mongo:27017/fastgpt?authSource=admin
  DB_MAX_LINK: 30
  REDIS_URL: redis://default:mypassword@fastgpt-redis:6379
  STORAGE_VENDOR: minio
  STORAGE_REGION: us-east-1
  STORAGE_ACCESS_KEY_ID: minioadmin
  STORAGE_SECRET_ACCESS_KEY: minioadmin
  STORAGE_PUBLIC_BUCKET: fastgpt-public
  STORAGE_PRIVATE_BUCKET: fastgpt-private
  STORAGE_DOWNLOAD_URL_MODE: short-proxy
  STORAGE_S3_ENDPOINT: http://fastgpt-minio:9000
  STORAGE_S3_FORCE_PATH_STYLE: true
  STORAGE_S3_MAX_RETRIES: 3
x-log-config: &x-log-config
  LOG_ENABLE_CONSOLE: true
  LOG_CONSOLE_LEVEL: info
  LOG_ENABLE_OTEL: false

services:
  fastgpt-vector:
    image: pgvector/pgvector:0.8.0-pg15
    container_name: fastgpt-pg
    restart: unless-stopped
    mem_limit: 768m
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    volumes:
      - fastgpt-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'username', '-d', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  fastgpt-mongo:
    image: mongo:5.0.32
    container_name: fastgpt-mongo
    restart: unless-stopped
    mem_limit: 1g
    command: mongod --keyFile /data/mongodb.key --replSet rs0 --wiredTigerCacheSizeGB 0.25
    environment:
      - MONGO_INITDB_ROOT_USERNAME=myusername
      - MONGO_INITDB_ROOT_PASSWORD=mypassword
    volumes:
      - fastgpt-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongo', '-u', 'myusername', '-p', 'mypassword', '--authenticationDatabase', 'admin', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 128 > /data/mongodb.key
        chmod 400 /data/mongodb.key
        chown 999:999 /data/mongodb.key
        echo 'const isInited = rs.status().ok === 1
        if(!isInited){
          rs.initiate({ _id: "rs0", members: [ { _id: 0, host: "fastgpt-mongo:27017" } ] })
        }' > /data/initReplicaSet.js
        exec docker-entrypoint.sh "$$@" &
        until mongo -u myusername -p mypassword --authenticationDatabase admin --eval "print('waited for connection')"; do
          echo "Waiting for MongoDB to start..."
          sleep 2
        done
        mongo -u myusername -p mypassword --authenticationDatabase admin /data/initReplicaSet.js
        wait $$!

  fastgpt-redis:
    image: redis:7.2-alpine
    container_name: fastgpt-redis
    restart: unless-stopped
    mem_limit: 384m
    command: |
      redis-server --requirepass mypassword --loglevel warning --appendonly yes --save 60 10 --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'mypassword', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    volumes:
      - fastgpt-redis:/data

  fastgpt-minio:
    # minio/minio больше не публикуется на Docker Hub; сборка Chainguard без shell/curl,
    # поэтому без healthcheck и от root (иначе нет прав на запись в volume).
    image: cgr.dev/chainguard/minio:latest
    container_name: fastgpt-minio
    restart: unless-stopped
    user: root
    mem_limit: 512m
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - fastgpt-minio:/data
    command: server /data --console-address ":9001"

  fastgpt-app:
    container_name: fastgpt-app
    image: ghcr.io/labring/fastgpt:v4.17.2
    restart: unless-stopped
    # Пул воркеров FastGPT планирует память от лимита контейнера минус резерв 512 МБ:
    # при 2g разбор файлов стоял (memorySchedulableBytes: 0).
    mem_limit: 3g
    ports:
      - 3000:3000
    depends_on:
      fastgpt-mongo:
        condition: service_healthy
      fastgpt-vector:
        condition: service_healthy
      fastgpt-redis:
        condition: service_healthy
      fastgpt-minio:
        condition: service_started
      fastgpt-code-sandbox:
        condition: service_healthy
      fastgpt-plugin:
        condition: service_healthy
      fastgpt-aiproxy:
        condition: service_healthy
    environment:
      <<: [*x-share-db-config, *x-log-config]
      PG_URL: postgresql://username:password@fastgpt-vector:5432/postgres
      HOSTNAME: 0.0.0.0
      FE_DOMAIN: http://localhost:3000
      ROOT_KEY: fastgpt-bench-rootkey
      DEFAULT_ROOT_PSW: '1234'
      DB_MAX_LINK: 20
      SYNC_INDEX: true
      SYSTEM_MAX_STRING_LENGTH_M: 100
      FILE_TOKEN_KEY: filetokenkey
      AES256_SECRET_KEY: fastgptsecret
      INVOKE_TOKEN_SECRET: fastgpt_invoke_token_secret_32_chars_min
      MULTIPLE_DATA_TO_BASE64: false
      PLUGIN_BASE_URL: http://fastgpt-plugin:3000
      PLUGIN_TOKEN: fastgpt_plugin_auth_token_32char
      CODE_SANDBOX_URL: http://fastgpt-code-sandbox:3000
      CODE_SANDBOX_TOKEN: codesandbox
      # 4.17 не стартует без AI Proxy; модели всё равно ходят в LiteLLM по custom request URL.
      AIPROXY_API_ENDPOINT: http://fastgpt-aiproxy:3000
      AIPROXY_API_TOKEN: aiproxy-token
      LOG_OTEL_SERVICE_NAME: fastgpt-client
      # Параллелизм индексации умеренный: эмбеддер стенда (TEI на CPU) — узкое место.
      DATASET_PARSE_MAX_PROCESS: 2
      VECTOR_MAX_PROCESS: 4
      QA_MAX_PROCESS: 2
      VLM_MAX_PROCESS: 1
      HNSW_EF_SEARCH: 100
      HNSW_MAX_SCAN_TUPLES: 100000

  fastgpt-code-sandbox:
    container_name: fastgpt-code-sandbox
    image: ghcr.io/labring/fastgpt-code-sandbox:v4.17.0
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *x-log-config
      SANDBOX_TOKEN: codesandbox
      SANDBOX_POOL_SIZE: 1
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then((res) => { if (!res.ok) throw new Error(String(res.status)); })"]
      interval: 30s
      timeout: 20s
      retries: 3

  fastgpt-plugin:
    image: ghcr.io/labring/fastgpt-plugin:v1.1.4
    container_name: fastgpt-plugin
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: [*x-share-db-config, *x-log-config]
      AUTH_TOKEN: fastgpt_plugin_auth_token_32char
      SERVICE_REQUEST_MAX_CONTENT_LENGTH: 10
      MAX_API_SIZE: 10
    depends_on:
      fastgpt-mongo:
        condition: service_healthy
      fastgpt-minio:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 20s
      retries: 3

  fastgpt-aiproxy:
    image: ghcr.io/labring/aiproxy:v0.7.3
    container_name: fastgpt-aiproxy
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      fastgpt-aiproxy-pg:
        condition: service_healthy
    environment:
      ADMIN_KEY: aiproxy-token
      LOG_DETAIL_STORAGE_HOURS: 1
      SQL_DSN: postgres://postgres:aiproxy@fastgpt-aiproxy-pg:5432/aiproxy
      RETRY_TIMES: 3
      BILLING_ENABLED: false
      DISABLE_MODEL_CONFIG: true
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/status']
      interval: 5s
      timeout: 5s
      retries: 10

  fastgpt-aiproxy-pg:
    image: pgvector/pgvector:0.8.0-pg15
    container_name: fastgpt-aiproxy-pg
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - fastgpt-aiproxy_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: aiproxy
      POSTGRES_PASSWORD: aiproxy
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'aiproxy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fastgpt-aiproxy_pg:
  fastgpt-pg:
  fastgpt-mongo:
  fastgpt-redis:
  fastgpt-minio:
