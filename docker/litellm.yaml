# Единые алиасы моделей для прототипа и всех конкурентов на стенде.
# Бэкенд каждого алиаса меняется здесь, код обращается только к алиасам.
model_list:
  # Генерация и судья RAGAS — через OpenRouter (id моделей задаются в .env,
  # т.к. список бесплатных моделей OpenRouter со временем меняется).
  - model_name: chat
    litellm_params:
      model: os.environ/CHAT_MODEL
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: judge
    litellm_params:
      model: os.environ/JUDGE_MODEL
      api_key: os.environ/OPENROUTER_API_KEY

  # Проверка вопросов датасета (benchmarks/check_questions.py). Модель другого семейства,
  # чем генератор, судья и автор черновика вопросов, чтобы не было самосогласия.
  - model_name: check
    litellm_params:
      model: os.environ/CHECK_MODEL
      api_key: os.environ/OPENROUTER_API_KEY

  # Локальный TEI отдаёт OpenAI-совместимый /v1/embeddings.
  - model_name: embed
    litellm_params:
      model: openai/BAAI/bge-m3
      api_base: http://tei-embed:80/v1
      api_key: unused

  # Локальный TEI с кросс-энкодером, эндпоинт /rerank.
  - model_name: rerank
    litellm_params:
      model: huggingface/BAAI/bge-reranker-v2-m3
      api_base: http://tei-rerank:80
      api_key: unused

litellm_settings:
  drop_params: true
