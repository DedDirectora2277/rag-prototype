name: rag-proto

# Образы TEI собраны под CPU. Для GPU (GTX 16xx — архитектура Turing) замените тег
# на turing-1.8 и добавьте deploy.resources.reservations.devices с driver: nvidia.
x-tei: &tei
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
  volumes:
    - hf-cache:/data
  # Обе модели — XLM-R large (568M) в fp32, ~2.2 ГБ весов каждая. Прогрев по умолчанию
  # идёт на батче в 16k токенов и одновременно двух контейнеров валит всю WSL-VM по OOM.
  # Лимит памяти нужен, чтобы при нехватке убивался контейнер, а не VM.
  mem_limit: 4g
  environment:
    MAX_BATCH_TOKENS: 2048
    MAX_CLIENT_BATCH_SIZE: 64  # >= Settings.embed_batch_size
    AUTO_TRUNCATE: 'true'
  healthcheck:
    test: ['CMD-SHELL', 'curl -fs http://localhost:80/health || exit 1']
    interval: 10s
    timeout: 5s
    retries: 60  # первая загрузка модели занимает несколько минут

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  tei-embed:
    <<: *tei
    command: ['--model-id', 'BAAI/bge-m3']
    ports:
      - '${TEI_EMBED_PORT:-8081}:80'

  tei-rerank:
    <<: *tei
    command: ['--model-id', 'BAAI/bge-reranker-v2-m3']
    ports:
      - '${TEI_RERANK_PORT:-8082}:80'
    # Поднимаем после эмбеддера, чтобы два прогрева не шли одновременно.
    depends_on:
      tei-embed:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ['--config', '/app/config.yaml', '--port', '4000']
    mem_limit: 1g
    env_file:
      - path: ../.env
        required: false
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-rag-proto}
    ports:
      - '${LITELLM_PORT:-4000}:4000'
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    depends_on:
      tei-embed:
        condition: service_healthy
      tei-rerank:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')"']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  hf-cache:
