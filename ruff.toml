line-length = 100
target-version = 'py312'
extend-exclude = ['tests/fixtures']  # фикстуры чанкеров — данные, а не код проекта

[lint]
select = [
    'E', 'W', 'F', 'I', 'B', 'UP', 'ASYNC', 'RUF',
    'N',    # pep8-naming: snake_case для функций/переменных
    'Q',    # одинарные кавычки
    'D',    # docstrings (Google)
    'SIM', 'C4', 'PTH', 'T20',
]
ignore = [
    'RUF001', 'RUF002', 'RUF003',  # кириллица в строках/комментариях/docstrings
    'D100', 'D104',                # docstring модуля / пакета
    'D105', 'D107',                # magic-методы и __init__
]

[lint.per-file-ignores]
'tests/**' = ['D']
'benchmarks/**' = ['D', 'T20']  # скрипты бенчмарков печатают результаты
'docs/**' = ['D', 'T20']        # скрипты сборки отчёта

[lint.pydocstyle]
convention = 'google'

[lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double'  # совместимо с форматтером
docstring-quotes = 'double'  # форматтер всегда ставит """ в docstrings

[format]
quote-style = 'single'
docstring-code-format = true

[lint.isort]
known-local-folder = ['conftest']  # общие фейки тестов из tests/conftest.py
